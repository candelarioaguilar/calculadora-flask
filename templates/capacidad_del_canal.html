<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora - Capacidad del Canal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 {
            margin-top: 0;
            color: #333333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555555;
            font-weight: bold;
        }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            border: 1px solid #f5c6cb;
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 4px;
            margin-top: 20px;
            border: 1px solid #c3e6cb;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Procesamiento de Datos</h2>

    {% if error %}
        <div class="alert-error">
            {{ error }}
        </div>
    {% endif %}

    <form action="/capacidad_del_canal" method="POST">
        <div class="form-group">
            <label for="valor1">Primer Valor:</label>
            <input type="number" step="any" id="valor1" name="valor1" value="{{ valor1 if valor1 is not none else '' }}" placeholder="Ingrese un número" required>
        </div>

        <div class="form-group">
            <label for="valor2">Segundo Valor:</label>
            <input type="number" step="any" id="valor2" name="valor2" value="{{ valor2 if valor2 is not none else '' }}" placeholder="Ingrese un número" required>
        </div>

        <button type="submit">Calcular Suma</button>
    </form>

    {% if resultado is not none %}
        <div class="alert-success">
            <strong>Resultado:</strong> {{ resultado }}
        </div>
    {% endif %}
</div>

</body>
</html>
